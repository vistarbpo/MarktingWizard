[project]
name = "marketing-wizard"
version = "0.1.0"
description = "AI marketing engine for SaaS companies and agencies: positioning, ICPs, copy, campaigns and GTM plans from one product brief."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mwiz = "marketing_wizard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketing_wizard*"]

[tool.setuptools.package-data]
marketing_wizard = ["static/*"]
