<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Support chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); font-family: var(--font), "IBM Plex Sans Arabic", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--border); }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
  header b { font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { unicode-bidi: plaintext; max-width: 82%; padding: 10px 12px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.note { align-self: center; background: var(--warn-soft); color: var(--warn); font-size: 13px; max-width: 92%; text-align: center; }
  .msg[dir="rtl"] { font-family: "IBM Plex Sans Arabic", var(--font); }
  .typing { color: var(--text-3); font-size: 13px; align-self: flex-start; }
  form { display: flex; gap: 8px; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  form textarea { flex: 1; resize: none; height: 44px; max-height: 120px; }
  .contact { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 12px; background: var(--surface); }
  .contact input { flex: 1 1 160px; }
  .foot { font-size: 11px; color: var(--text-3); text-align: center; padding: 6px; background: var(--surface); }
</style>
</head>
<body>
<header><span class="dot" aria-hidden="true"></span><div><b id="co">Support</b><div class="subtle" style="font-size:12px">AI assistant · a person steps in when needed</div></div></header>
<main id="log" aria-live="polite"></main>
<div class="contact" id="contactBox" hidden>
  <input class="input" id="cName" placeholder="Your name · اسمك" autocomplete="name">
  <input class="input" id="cContact" placeholder="WhatsApp or email · واتساب أو إيميل" autocomplete="email">
  <button class="btn" id="cSave" type="button">Save · حفظ</button>
</div>
<form id="f"><label for="m" class="subtle" style="position:absolute;left:-9999px">Message</label><textarea class="input" id="m" placeholder="Write your question · اكتب سؤالك" required></textarea><button class="btn btn-primary" type="submit">Send</button></form>
<div class="foot">Replies are written by AI and may be checked by our team.</div>
<script>
const key = location.pathname.split("/").filter(Boolean).pop();
const log = document.getElementById("log"), m = document.getElementById("m");
const isAr = (t) => /[؀-ۿ]/.test(t || "");
let token = null, contact = "", name = "";
try { token = localStorage.getItem("mwiz-chat-" + key); } catch {}
function add(text, cls) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; d.dir = "auto";
  log.appendChild(d); log.scrollTop = 1e9; return d;
}
fetch(`/api/public/support/${key}`).then((r) => r.ok ? r.json() : null).then((info) => {
  if (info) { document.getElementById("co").textContent = info.company + " support"; document.title = info.company + " support"; }
  add("أهلاً! كيف نقدر نساعدك اليوم؟\nHi! How can we help you today?", "bot");
});
m.addEventListener("input", () => { m.dir = isAr(m.value) ? "rtl" : "ltr"; });
m.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
document.getElementById("cSave").onclick = () => {
  name = document.getElementById("cName").value.trim(); contact = document.getElementById("cContact").value.trim();
  if (!contact) return;
  document.getElementById("contactBox").hidden = true;
  add("Thanks, our team will reach you at " + contact + " · شكراً، بنتواصل معك قريباً", "note");
  send(null);
};
async function send(text) {
  const body = { message: text || "(customer left contact: " + contact + ")", token, name, contact };
  const typing = document.createElement("div"); typing.className = "typing"; typing.textContent = "…";
  if (text) log.appendChild(typing);
  try {
    const r = await fetch(`/api/public/support/${key}/chat`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    typing.remove();
    if (j.token) { token = j.token; try { localStorage.setItem("mwiz-chat-" + key, token); } catch {} }
    if (!r.ok) { add(j.detail || "Sorry, something went wrong. Please try again.", "note"); return; }
    if (j.reply && text) add(j.reply, "bot");
    if (j.handed_over && text) {
      if (!j.reply) add("A team member will follow up with you. · بيتواصل معك أحد من الفريق قريباً", "note");
      if (!contact) document.getElementById("contactBox").hidden = false;
    }
  } catch { typing.remove(); add("Connection problem. Please try again.", "note"); }
}
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = m.value.trim(); if (!text) return;
  add(text, "me"); m.value = ""; m.dir = "ltr"; send(text);
});
</script>
</body>
</html>
