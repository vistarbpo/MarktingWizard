<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Marketing Wizard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f5f6f4;--surface:#fff;--ink:#15201d;--muted:#5b6a65;--line:#dfe4e1;--accent:#e2492f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--surface:#17201d;--ink:#e6ece9;--muted:#97a6a0;--line:#2a3632;--accent:#ff6a4d;--accent-ink:#1a0d09;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
h1{font:700 22px "Bricolage Grotesque",system-ui,sans-serif;margin:0}h1 span{color:var(--accent)}
p{margin:0;color:var(--muted)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.err{color:var(--accent);font-weight:600}
</style></head><body>
<form method="post" action="/login">
  <h1>Marketing <span>Wizard</span></h1>
  <p>DPA AD workspace</p>
  <p class="err" id="err" hidden></p>
  <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Sign in</button>
</form>
<script>
const e = new URLSearchParams(location.search).get("e");
const m = {bad:"That password is wrong. Try again.", locked:"Too many attempts. Wait 15 minutes and try again.", unset:"No password is set yet. Add DASHBOARD_PASSWORD in hPanel's environment variables."}[e];
if (m) { const el = document.getElementById("err"); el.textContent = m; el.hidden = false; }
</script>
</body></html>
