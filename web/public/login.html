<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Marketing Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: var(--s-4); }
  .login { width: 100%; max-width: 380px; }
  .login .brand { padding: 0; margin-bottom: var(--s-5); }
  .err { color: var(--bad); font-size: var(--fs-sm); font-weight: 500; }
</style>
</head>
<body>
<main class="login">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M6 13.5 9 6.5l2 4.5 1.5-2.5L14 13.5" stroke="var(--accent-ink)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Marketing Wizard</span>
  </div>
  <form class="card card-body stack" method="post" action="/login">
    <div><h1>Sign in</h1><p class="muted" style="margin-top:4px">Enter the team password to continue.</p></div>
    <p class="err" id="err" role="alert" hidden></p>
    <div class="field"><label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
    <button class="btn btn-primary" type="submit" style="height:40px">Sign in</button>
  </form>
</main>
<script>
const e = new URLSearchParams(location.search).get("e");
const m = { bad: "That password is wrong. Try again.", locked: "Too many attempts. Wait 15 minutes and try again.", unset: "No password is set yet. Add DASHBOARD_PASSWORD in hPanel's environment variables." }[e];
if (m) { const el = document.getElementById("err"); el.textContent = m; el.hidden = false; }
</script>
</body>
</html>
