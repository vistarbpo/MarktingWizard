<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Marketing Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M6 13.5 9 6.5l2 4.5 1.5-2.5L14 13.5" stroke="var(--accent-ink)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Marketing Wizard</span>
    </div>

    <div class="ws-switch">
      <label class="eyebrow" for="wsSelect">Workspace</label>
      <div class="row gap-8">
        <select id="wsSelect" class="input input-sm"></select>
        <button class="btn btn-icon" title="New workspace" aria-label="New workspace" data-action="new-ws">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a data-route="sop">SOP</a>
      <a data-route="overview">Overview</a>
      <div class="nav-group">Company data</div>
      <a data-route="brief">Brief</a>
      <a data-route="knowledge">Knowledge</a>
      <a data-route="kpis">KPIs</a>
      <div class="nav-group">Execution</div>
      <a data-route="playbooks">Playbooks</a>
      <a data-route="library">Library</a>
    </nav>

    <div class="sidebar-foot">
      <span class="status-dot" id="providerDot"></span>
      <span id="providerLabel" class="muted grow">Connecting…</span>
      <form method="post" action="/logout"><button class="btn btn-sm btn-ghost" type="submit">Log out</button></form>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="crumb"></div>
        <h1 id="pageTitle"></h1>
      </div>
      <div class="row gap-8" id="pageActions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" class="dialog"></dialog>
<script src="/vendor/marked.js"></script>
<script src="/app.js"></script>
</body>
</html>
