<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marketing Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="5" fill="var(--accent)"/><path d="M6 13.5 9 6.5l2 4.5 1.5-2.5L14 13.5" stroke="var(--accent-ink)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Marketing Wizard</span>
    </div>

    <div class="ws-switch">
      <label class="eyebrow" for="wsSelect">Workspace</label>
      <div class="row gap-8">
        <select id="wsSelect" class="input input-sm"></select>
        <button class="btn btn-icon" title="New workspace" aria-label="New workspace" data-action="new-ws">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a data-route="command">Command Center</a>
      <a data-route="sop">SOP</a>
      <a data-route="overview">Overview</a>
      <div class="nav-group">Company data</div>
      <a data-route="brief">Brief</a>
      <a data-route="knowledge">Knowledge</a>
      <a data-route="kpis">KPIs</a>
      <div class="nav-group">Execution</div>
      <a data-route="playbooks">Playbooks</a>
      <a data-route="library">Library</a>
      <div class="nav-group">Sales</div>
      <a data-route="pipeline">Pipeline</a>
      <div class="nav-group">Product</div>
      <a data-route="product">Product</a>
      <div class="nav-group">Customers</div>
      <a data-route="support">AI Support</a>
      <a data-route="results">ROAS results</a>
      <div class="nav-group">Finance</div>
      <a data-route="finance">Finance</a>
      <div class="nav-group">Operations</div>
      <a data-route="ops">Operations</a>
      <div class="nav-group">People</div>
      <a data-route="team">Team & hiring</a>
      <div class="nav-group">Settings</div>
      <a data-route="access">Teams & roles</a>
    </nav>

    <div id="whoami"></div>
    <div class="sidebar-foot">
      <span class="status-dot" id="providerDot"></span>
      <span id="providerLabel" class="muted grow">Connecting…</span>
      <form method="post" action="/logout"><button class="btn btn-sm btn-ghost" type="submit">Log out</button></form>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <div class="eyebrow" id="crumb"></div>
        <h1 id="pageTitle"></h1>
      </div>
      <div class="row gap-8 page-actions" id="pageActions"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="nav-scrim" id="navScrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" class="dialog"></dialog>
<script src="/vendor/marked.js"></script>
<script src="/app.js"></script>
<script src="/sales.js"></script>
<script src="/hr.js"></script>
<script src="/support.js"></script>
<script src="/finance.js"></script>
<script src="/ops.js"></script>
<script src="/product.js"></script>
<script src="/roas.js"></script>
<script src="/access.js"></script>
<script src="/command.js"></script>
</body>
</html>
